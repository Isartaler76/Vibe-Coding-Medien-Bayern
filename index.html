<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Weihnachtsgeschenke-Finder | Dein perfektes Geschenk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Raleway:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg, #165B33 0%, #BB2528 50%, #146B3A 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Snowflakes Animation */
        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 1;
            color: white;
            font-size: 1em;
            font-family: Arial;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glitter Effect */
        .glitter {
            position: fixed;
            width: 3px;
            height: 3px;
            background: gold;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 5px solid #FFD700;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '✨';
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: -20px;
            left: -20px;
            animation: rotate 10s linear infinite;
        }

        .header::after {
            content: '🎁';
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            bottom: -20px;
            right: -20px;
            animation: rotate 10s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 3.5em;
            color: #BB2528;
            text-shadow: 3px 3px 0 #FFD700, 6px 6px 0 #165B33;
            margin-bottom: 15px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle {
            font-size: 1.3em;
            color: #165B33;
            font-weight: 600;
        }

        /* Music Control */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid #FFD700;
            cursor: pointer;
            font-size: 1.2em;
            transition: transform 0.3s;
        }

        .music-control:hover {
            transform: scale(1.1);
        }

        /* Input Section */
        .input-section {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 4px solid #FFD700;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.2em;
            font-weight: 700;
            color: #BB2528;
            margin-bottom: 10px;
            font-family: 'Mountains of Christmas', cursive;
        }

        select {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 3px solid #165B33;
            border-radius: 15px;
            background: white;
            color: #165B33;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover, select:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            outline: none;
        }

        .find-button {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            font-weight: 700;
            background: linear-gradient(45deg, #BB2528, #FF3B3F);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(187, 37, 40, 0.4);
            transition: all 0.3s;
            font-family: 'Mountains of Christmas', cursive;
            margin-top: 20px;
        }

        .find-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(187, 37, 40, 0.6);
        }

        .find-button:active {
            transform: scale(0.98);
        }

        /* Slot Machine */
        .slot-machine {
            display: none;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 5px solid #FFD700;
            margin-bottom: 30px;
        }

        .slot-machine.active {
            display: block;
        }

        .slots-title {
            text-align: center;
            font-family: 'Mountains of Christmas', cursive;
            font-size: 2.5em;
            color: #BB2528;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #FFD700;
        }

        .slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .slot {
            background: white;
            border: 4px solid #165B33;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .slot::before {
            content: '⭐';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 2em;
            opacity: 0.3;
        }

        .slot:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
            border-color: #FFD700;
        }

        .slot.spinning {
            animation: spin 0.5s ease-in-out;
        }

        @keyframes spin {
            0% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .gift-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 3px solid #FFD700;
        }

        .gift-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #BB2528;
            margin-bottom: 10px;
            font-family: 'Mountains of Christmas', cursive;
        }

        .gift-price {
            font-size: 1.1em;
            color: #165B33;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .buy-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #165B33;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1em;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .buy-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }

        .reset-button {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: #165B33;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-button:hover {
            background: #1a7a42;
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px;
            color: white;
            font-size: 1.1em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .slots-container {
                grid-template-columns: 1fr;
            }

            .input-section {
                padding: 20px;
            }
        }
    </style>
</head>

        let isMusicPlaying = false;
        const musicControl = document.getElementById('musicControl');
        const bgMusic = document.getElementById('bgMusic');
        const musicStatus = document.getElementById('musicStatus');

        musicControl.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicStatus.textContent = 'Musik aus';
                isMusicPlaying = false;
            } else {
                bgMusic.play();
                musicStatus.textContent = 'Musik an';
                isMusicPlaying = true;
            }
        });

        // Create Snowflakes
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆'];

            for (let i = 0; i < 20; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 1 + 0.5) + 'em';
                snowflakesContainer.appendChild(snowflake);
            }
        }

        // Create Glitter
        function createGlitter() {
            const glitterContainer = document.getElementById('glitter');

            for (let i = 0; i < 30; i++) {
                const glitter = document.createElement('div');
                glitter.className = 'glitter';
                glitter.style.left = Math.random() * 100 + '%';
                glitter.style.top = Math.random() * 100 + '%';
                glitter.style.animationDelay = Math.random() * 2 + 's';
                glitterContainer.appendChild(glitter);
            }

            const interest = document.getElementById('interest').value;
            const age = document.getElementById('age').value;
            const budget = document.getElementById('budget').value;

            if (!interest || !age || !budget) {
                alert('🎅 Bitte fülle alle 3 Felder aus! 🎄');
                return;
            }

            // Filter and score gifts
            const scoredGifts = giftDatabase.map(gift => {
                let score = 0;
                if (gift.tags.includes(interest)) score += 3;
                if (gift.tags.includes(age)) score += 2;
                if (gift.priceRange === budget) score += 2;
                return { ...gift, score };
            }).filter(gift => gift.score > 0)
              .sort((a, b) => b.score - a.score)
              .slice(0, 3);

            if (scoredGifts.length === 0) {
                alert('🎅 Keine passenden Geschenke gefunden. Versuche andere Optionen! 🎄');
                return;
            }

            // Show slot machine with animation
            const slotMachine = document.getElementById('slotMachine');
            const slotsContainer = document.getElementById('slotsContainer');

            // Clear previous results
            slotsContainer.innerHTML = '';

            // Create slots with spinning animation
            scoredGifts.forEach((gift, index) => {
                setTimeout(() => {
                    const slot = document.createElement('div');
                    slot.className = 'slot spinning';
                    slot.innerHTML = `
                        <img src="${gift.image}" alt="${gift.name}" class="gift-image" />
                        <div class="gift-name">${gift.name}</div>
                        <div class="gift-price">${gift.price}</div>
                        <a href="${gift.link}" target="_blank" class="buy-button">🛒 Jetzt kaufen</a>
                    `;
                    slotsContainer.appendChild(slot);

                    // Remove spinning class after animation
                    setTimeout(() => {
                        slot.classList.remove('spinning');
                    }, 500);
                }, index * 200);
            });

            // Show slot machine
            slotMachine.classList.add('active');
            slotMachine.scrollIntoView({ behavior: 'smooth' });
        }

        // Reset Function
        function resetFinder() {
            document.getElementById('interest').value = '';
            document.getElementById('age').value = '';
            document.getElementById('budget').value = '';
            document.getElementById('slotMachine').classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize animations on page load
        window.addEventListener('load', () => {
            createSnowflakes();
            createGlitter();
        });
    </script>
</body>
</html>
